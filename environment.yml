name: tps-alzheimer
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11   # también probado en 3.13 (ver requirements.txt para pip-only)
  # Núcleo EEG
  - mne>=1.6
  - mne-bids>=0.14
  # DSP / numérico
  - numpy>=1.26
  - scipy>=1.11
  - pywavelets>=1.5
  - pandas>=2.1
  - h5py>=3.10
  # ML
  - scikit-learn>=1.4
  - pytorch>=2.2
  - torchvision
  - pytorch-cuda=12.1   # quitar esta línea si no hay GPU NVIDIA
  # Configs / utils
  - pyyaml
  - tqdm
  - rich
  # Viz
  - matplotlib>=3.8
  - seaborn
  # Notebooks
  - jupyterlab
  - ipykernel
  # Test / lint
  - pytest
  - ruff
  - black
  - pip
  - pip:
      - mne-icalabel>=0.6
      - openneuro-py>=2024.0
      - hydra-core>=1.3
      - grad-cam>=1.5
      - captum>=0.7
      - pyprep>=0.4
