[project]
name = "tps-alzheimer"
version = "0.1.0"
description = "Replicación de Lopes et al. 2023 (CNN saliency + modulation spectrum) sobre OpenNeuro ds004504, comparando STFT vs CWT-Morlet"
authors = [{ name = "Sebastián Palacio Betancur" }]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.models", "src.utils"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
